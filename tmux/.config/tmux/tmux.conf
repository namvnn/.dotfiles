# set prefix key
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# start indexing windows at 1 instead of 0
set-option -g base-index 1

# renumber all windows when any window is closed
set-option -g renumber-windows on

# start pane indexing at 1 instead of 0
setw -g pane-base-index 1

# extend the overlay numbers display time to 3 seconds
set -g display-panes-time 3000

# use system clipboard
set-option -g set-clipboard on

# enable mouse
set-option -g mouse on

# copy in vim mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# reload settings
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# open a session given the selected path
bind-key f run-shell "tmux neww tmuxs"

# open the .dotfiles directory in editor
bind-key C-d display-popup -w 90% -h 90% -E "cd ~/.dotfiles && nvim || vim"
